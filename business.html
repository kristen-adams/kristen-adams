<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, inital-scale=1.0" />
        <title>Kristen Adams</title>
        <link href=https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
       <!-- top navbar-->
        <header class="navbar">
            <div class="left-nav">
                <a href="index.html" class="logo-small">KRISTEN ADAMS</a>
                <nav class="nav-links">
                    <a href="watching.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="#">Projects</a>
                </nav>
            </div>
            <div class="profile-icon">
                <img src="assets/business.png" alt="Profile Icon" onclick="goToWatching()" />
            </div>
        </header>

        <!-- banner with GIF -->
         <section class="hero" style="background-image: url('assets/business.gif');">
            <div class="hero-content">
                <h1>The Rotational Analyst</h1>
                <p>Learning how to solve complex problems at the world's largest bank.</p>
                <div class="hero-buttons">
                    <button class="play-btn" onclick="scrollToProjects()">▶ Play</button>
                    <button class="info-btn" onclick="goToAbout()">ⓘ Info</button>
                </div>
            </div>
         </section>
        
         <section class="top-picks">
            <h2>Today's Top Picks</h2>
            <div class="card-row">
                <div class="card">
                    <img src="assets/project1.jpg" alt="Project 1">
                    <div class="card-label">Project 1</div>
                </div>
                <div class="card">
                    <img src="assets/project2.jpg" alt="Project 2">
                    <div class="card-label">Project 2</div>
                </div>
                <div class="card">
                    <img src="assets/project3.jpg" alt="Project 3">
                    <div class="card-label">Project 3</div>
                </div>
                <div class="card">
                    <img src="assets/project4.jpg" alt="Project 4">
                    <div class="card-label">Project 4</div>
                </div>
            </div>
         </section>


         <script>
            function goToWatching() {
                window.location.href = "watching.html";
            }
         </script>
         <script>
            function goToAbout() {
                window.location.href = "about.html";
            }

            function scrollToProjects() {
                const projects = document.getElementById("top-picks");
                    if (projects) {
                        projects.scrollIntoView({behavior: "smooth"})
                    }
            }
         </script>

    </body>
</html>
